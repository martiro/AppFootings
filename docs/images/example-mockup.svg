nter, 'DejaVu Sans', sans-serif" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle" >10</text><rect x="81" y="446" width="34" height="50" rx="8" fill="#E4F4EC" stroke="none" stroke-width="1" /><text x="98" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#2E9E6A" font-weight="600" text-anchor="middle" >T</text><text x="98" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle" >11</text><rect x="122" y="446" width="34" height="50" rx="8" fill="#F4D9D9" stroke="none" stroke-width="1" /><text x="139" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#D64545" font-weight="600" text-anchor="middle" >W</text><text x="139" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#D64545" font-weight="700" text-anchor="middle" >12</text><rect x="163" y="446" width="34" height="50" rx="8" fill="#F4D9D9" stroke="none" stroke-width="1" /><text x="180" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#D64545" font-weight="600" text-anchor="middle" >T</text><text x="180" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#D64545" font-weight="700" text-anchor="middle" >13</text><rect x="204" y="446" width="34" height="50" rx="8" fill="#E4F4EC" stroke="none" stroke-width="1" /><text x="221" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#2E9E6A" font-weight="600" text-anchor="middle" >F</text><text x="221" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle" >14</text><rect x="245" y="446" width="34" height="50" rx="8" fill="#E4F4EC" stroke="none" stroke-width="1" /><text x="262" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#2E9E6A" font-weight="600" text-anchor="middle" >S</text><text x="262" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle" >15</text><rect x="286" y="446" width="34" height="50" rx="8" fill="#E4F4EC" stroke="none" stroke-width="1" /><text x="303" y="466" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#2E9E6A" font-weight="600" text-anchor="middle" >S</text><text x="303" y="486" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#2E9E6A" font-weight="700" text-anchor="middle" >16</text><text x="40" y="512" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="11" fill="#6B7785" font-weight="400" text-anchor="start" >Red = already on loan</text><rect x="24" y="534" width="312" height="76" rx="14" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1" /><text x="40" y="560" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" >Lending rules</text><text x="40" y="580" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#6B7785" font-weight="400" text-anchor="start" >Pick-up at owner's home · no deposit</text><text x="40" y="598" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#6B7785" font-weight="400" text-anchor="start" >Owner answers within 48 h</text><rect x="24" y="636" width="312" height="48" rx="12" fill="#0E8C8C" stroke="none" stroke-width="1" /><text x="180.0" y="665.0" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle" >Request to borrow</text><text x="180" y="708" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#0E8C8C" font-weight="600" text-anchor="middle" >Ask Giulia a question</text></g><rect x="430" y="160" width="802" height="330" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1" /><text x="458" y="200" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" fill="#0F2A44" font-weight="700" text-anchor="start" >What it covers</text><rect x="458" y="220" width="44.4" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="480.2" y="235" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >F-03</text><text x="548" y="236" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Borrow an item: entry point of the request</text><rect x="458" y="256" width="44.4" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="480.2" y="271" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >R-05</text><text x="548" y="272" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >A loan lasts at most the group's maximum (shown as a chip)</text><rect x="458" y="292" width="44.4" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="480.2" y="307" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >R-06</text><text x="548" y="308" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Days already on loan cannot be selected</text><rect x="458" y="328" width="44.4" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="480.2" y="343" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >R-09</text><text x="548" y="344" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Requests blocked while the member has an overdue loan</text><rect x="458" y="364" width="59.599999999999994" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="487.8" y="379" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >PAR-02</text><text x="548" y="380" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Max loan duration · default 3 days · set by group admin</text><rect x="458" y="400" width="59.599999999999994" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="487.8" y="415" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >PAR-03</text><text x="548" y="416" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Owner answer time · default 48 h · platform parameter</text><rect x="458" y="436" width="44.4" height="22" rx="6" fill="#E6ECF2" stroke="none" stroke-width="1" /><text x="480.2" y="451" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#0F2A44" font-weight="700" text-anchor="middle" >P-03</text><text x="548" y="452" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="400" text-anchor="start" >Process “Borrow an item”, step 1</text><rect x="430" y="510" width="802" height="340" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1" /><text x="458" y="550" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" fill="#0F2A44" font-weight="700" text-anchor="start" >How it works</text><circle cx="470" cy="581" r="11" fill="#E3F3F3"/><text x="470" y="586" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#0E8C8C" font-weight="700" text-anchor="middle" >1</text><text x="492" y="586" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >Opened from the nearby list (S-02) or from a shared link.</text><circle cx="470" cy="615" r="11" fill="#E3F3F3"/><text x="470" y="620" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#0E8C8C" font-weight="700" text-anchor="middle" >2</text><text x="492" y="620" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >The availability strip shows the next 7 days: green free, red already on loan. Tapping a</text><text x="492" y="640" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >free day pre-fills the request dates.</text><circle cx="470" cy="669" r="11" fill="#E3F3F3"/><text x="470" y="674" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#0E8C8C" font-weight="700" text-anchor="middle" >3</text><text x="492" y="674" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >“Request to borrow” opens S-05. It is disabled, with the reason shown, if the item is</text><text x="492" y="694" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >unavailable for the whole week or the user has an overdue loan (R-09).</text><circle cx="470" cy="723" r="11" fill="#E3F3F3"/><text x="470" y="728" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#0E8C8C" font-weight="700" text-anchor="middle" >4</text><text x="492" y="728" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >“Ask Giulia a question” opens a chat invitation; the owner must accept it before messages</text><text x="492" y="748" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >arrive.</text><circle cx="470" cy="777" r="11" fill="#E3F3F3"/><text x="470" y="782" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="12" fill="#0E8C8C" font-weight="700" text-anchor="middle" >5</text><text x="492" y="782" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >Empty state: no photo → category icon. Error state: item withdrawn → banner and back to the</text><text x="492" y="802" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >list.</text></svg>