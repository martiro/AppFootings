 font-size="15" fill="#1B2430" font-weight="700" text-anchor="start" >Business &amp; roadmap</text><text x="680" y="416" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#8A5A12" font-weight="400" text-anchor="start" >check whether extensions are a paid feature</text><circle cx="474" cy="455" r="10" fill="#FDF3E2"/><text x="474" y="460" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#B87713" font-weight="800" text-anchor="middle" >!</text><text x="496" y="460" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="700" text-anchor="start" >Prompts</text><text x="680" y="460" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#8A5A12" font-weight="400" text-anchor="start" >PR-05 Borrowing to regenerate after OP-13</text><line x1="464" y1="486" x2="1204" y2="486" stroke="#DDE3EA"/><text x="464" y="514" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#6B7785" font-weight="400" text-anchor="start" >Not yet aligned items stay “needs alignment” in the Project Register until closed.</text></svg>