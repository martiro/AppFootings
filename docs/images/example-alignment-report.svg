<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600"><rect x="0" y="0" width="1280" height="600" rx="0" fill="#F5F7FA" stroke="none" stroke-width="1" /><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F2A44"/></marker><marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E8C8C"/></marker><marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker></defs><text x="48" y="60" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="26" fill="#1B2430" font-weight="700" text-anchor="start" >Every change ends with an alignment report</text><text x="48" y="88" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#6B7785" font-weight="400" text-anchor="start" >Example: the group decides the maximum loan duration becomes 5 days and can be extended once by the owner.</text><rect x="48" y="116" width="360" height="440" rx="16" fill="#0F2A44" stroke="none" stroke-width="1" /><text x="76" y="156" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#9FB4C9" font-weight="700" text-anchor="start" letter-spacing="1">Change</text><text x="76" y="190" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start" >Max loan 3 → 5 days;</text><text x="76" y="218" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="start" >owner can extend once</text><text x="76" y="262" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#9FB4C9" font-weight="400" text-anchor="start" >Written first in</text><text x="76" y="288" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="start" >Master › F-03, R-05, new R-11</text><text x="76" y="336" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#9FB4C9" font-weight="400" text-anchor="start" >Impacts traced through</text><text x="76" y="362" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" >• traceability matrix row F-03</text><text x="76" y="388" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" >• copies table (S-04, S-05)</text><text x="76" y="414" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start" >• parameters PAR-02, new PAR-07</text><text x="76" y="470" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="13" fill="#9FB4C9" font-weight="400" text-anchor="start" >New open point</text><text x="76" y="494" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#E8A33D" font-weight="600" text-anchor="start" >OP-13: who is notified of an extension?</text><rect x="436" y="116" width="796" height="440" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1" /><text x="464" y="154" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18" fill="#0F2A44" font-weight="700" text-anchor="start" >Alignment report</text><circle cx="474" cy="191" r="10" fill="#E4F4EC"/><path d="M469 191 L473 195 L480 186" fill="none" stroke="#2E9E6A" stroke-width="2.5"/><text x="496" y="196" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1B2430" font-weight="700" text-anchor="start" >Master</text><text x="680" y="196" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="14" fill="#1B2430" font-weight="400" text-anchor="start" >R-05 updated, R-11 added (OP-12: extension only if days are free)</text><circle cx="474" cy="235" r="10" fill="#E4F4EC"/><path d="M469 235 L473 239 L480 230" fill="none" stroke="#2E9E6A" stroke-width="2.5"/><text x="496" y="240" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="15" fill="#1